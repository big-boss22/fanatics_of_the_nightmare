midnight_spirit_desc1:0 "§YBorn§!: March 20th, 969 ALB\n\n§YRank§!: Lieutenant Colonel\n\n§YBiography§!: Midnight's life can be summed up with a simple phrase.\n\nOne long string of really, really bad decisions.\n\nHis parents were devout Lunarists, as was his younger sister. But him? He embraced the nightmare in a way not even they would go so far as to do. The writings of Starry Glory fascinated him, and accompanied him with his rise through Chiropterra's military. Wherein Midnight was seen as something of a rising star, attaining his officer's commission at a very early stage in his career, attaining the rank of Lieutenant Colonel by it's end, though, he took to referring to himself simply as Field Marshal, much to his superior's distaste.\n\nAlongside this rise, however, came the growth of his ideology, lunarist roots blooming into full blown Nightmareism, alongside Thestral Supremacism picked up from Starry's writings. These ideas, it turns out, were deemed ill-fitting for one of his station, and whilst stationed far afield on the Chiropterran frontier, he would receive a letter ordering his immediate return to New Ayacachtli to face court marshal for a number of atrocities carried out by his troops, which had by this point been fed just as much of his nonsense as he was.\n\nThis order was not heeded, and the 'Field Marshal' alongside a good number of his troops would cross the border into what would become Tobuck, beginning their mercenary odyssey in 1002, serving as troops bolstering one of the factions in the Mazwian Succession war. This did not come without cost, however, as Midnight's propensity for leading from the front would result in a brief period in which he would be captured, and the injuries to his wings during this rendered them unsalvageable, leading to him giving the order to remove them entirely, making him the bat with clipped wings he is today, though this jaunt through Mazwi would be cut short by the arrival of the Storm King, which he deemed to be a contract not worth taking. Now he schemes his own plots, but only time will tell if they succeed. \n\n§YPortrait By§!: GOAT"
honored_our_deal: "Honored our deal with the Changelings"
midnight_spirit1_desc: "§YBorn§!: March 20th, 969 ALB\n\n§YRank§!: Lieutenant Colonel\n\n§YBiography§!: Midnight's life can be summed up with a simple phrase.\n\nOne long string of really, really bad decisions.\n\nHis parents were devout Lunarists, as was his younger sister. But him? He embraced the nightmare in a way not even they would go so far as to do. The writings of Starry Glory fascinated him, and accompanied him with his rise through Chiropterra's military. Wherein Midnight was seen as something of a rising star, attaining his officer's commission at a very early stage in his career, attaining the rank of Lieutenant Colonel by it's end, though, he took to referring to himself simply as Field Marshal, much to his superior's distaste.\n\nAlongside this rise, however, came the growth of his ideology, lunarist roots blooming into full blown Nightmareism, alongside Thestral Supremacism picked up from Starry's writings. These ideas, it turns out, were deemed ill-fitting for one of his station, and whilst stationed far afield on the Chiropterran frontier, he would receive a letter ordering his immediate return to New Ayacachtli to face court marshal for a number of atrocities carried out by his troops, which had by this point been fed just as much of his nonsense as he was.\n\nThis order was not heeded, and the 'Field Marshal' alongside a good number of his troops would cross the border into what would become Tobuck, beginning their mercenary odyssey in 1002, serving as troops bolstering one of the factions in the Mazwian Succession war. This did not come without cost, however, as Midnight's propensity for leading from the front would result in a brief period in which he would be captured, and the injuries to his wings during this rendered them unsalvageable, leading to him giving the order to remove them entirely, making him the bat with clipped wings he is today, though this jaunt through Mazwi would be cut short by the arrival of the Storm King, which he deemed to be a contract not worth taking. Now he schemes his own plots, but only time will tell if they succeed. \n\n§YPortrait By§!: GOAT"
PCB_GATHERING_STORM_DESC: "The moon looms over the island nation of Puerto Caballo, a nation already destablised by socialist elements threatening the current harmonic status quo, but the new threat that looms is one that they are ill-prepared to face. It is only a matter of time before those faithful to the Nightmare seize their chance to strike, and the people of Puerto Caballo will be left to face the consequences of whatever this force's commander has in store for them."