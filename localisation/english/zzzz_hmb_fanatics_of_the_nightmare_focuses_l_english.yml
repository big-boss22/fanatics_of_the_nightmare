 my_hoi4_mod_new_focus_tree_focus_119_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_120:0 "The Home of The Shadowbolts"
 my_hoi4_mod_new_focus_tree_focus_120_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_121:0 "Extend Opioid Distribution to The Populace"
 my_hoi4_mod_new_focus_tree_focus_121_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_122:0 "Nightmare Factories"
 my_hoi4_mod_new_focus_tree_focus_122_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_123:0 "Profit"
 my_hoi4_mod_new_focus_tree_focus_123_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_124:0 "Order"
 my_hoi4_mod_new_focus_tree_focus_124_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_125:0 "The Puppet, with Strings Attached"
 my_hoi4_mod_new_focus_tree_focus_125_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_126:0 "The Puppet Flails"
 my_hoi4_mod_new_focus_tree_focus_126_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_127:0 "Acceptance"
 my_hoi4_mod_new_focus_tree_focus_127_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_14:0 "\"Civilian\" Industry"
 my_hoi4_mod_new_focus_tree_focus_14_desc:0 "Whilst civilian industry isn't of concern to us, we need to keep up appearances, besides, they can be retooled for our needs in the future."
 my_hoi4_mod_new_focus_tree_focus_15:0 "\"Transport\" Ship Production"
 my_hoi4_mod_new_focus_tree_focus_15_desc:0 "We must begin efforts to expand the pitiful fleet that we have taken from the locals... Immediately"
 my_hoi4_mod_new_focus_tree_focus_16:0 "Hidden Arms Manufacturing"
 my_hoi4_mod_new_focus_tree_focus_16_desc:0 "Whilst we can't build so much openly, we have gotten rather proficient at concealing our manufacturing efforts."
 my_hoi4_mod_new_focus_tree_focus_2:0 "The Coup"
 my_hoi4_mod_new_focus_tree_focus_20:0 "New Resources"
 my_hoi4_mod_new_focus_tree_focus_20_desc:0 "Our plans near fruition.\n\nWe must seek more resources for the cause."
 my_hoi4_mod_new_focus_tree_focus_27:0 "THIS IS NOT ENOUGH"
 my_hoi4_mod_new_focus_tree_focus_27_desc:0 "Our stockpiles? Lacking.\nOur advancements? Laughable.\n\nThis is pitiful. We must work harder."
 my_hoi4_mod_new_focus_tree_focus_28:0 "Dire Straits..."
 my_hoi4_mod_new_focus_tree_focus_28_desc:0 "Upon review, it seems what we have is clearly not good enough in the slightest, and things are already near breaking point..."
 my_hoi4_mod_new_focus_tree_focus_29:0 "Continue Innovation"
 my_hoi4_mod_new_focus_tree_focus_29_desc:0 "Our innovations must continue. For our cause demands it by any means."
 my_hoi4_mod_new_focus_tree_focus_2_desc:0 "For so long we have waited.\n\nSalvation is within our reach."
 my_hoi4_mod_new_focus_tree_focus_31:0 "Progress. Finally."
 my_hoi4_mod_new_focus_tree_focus_31_desc:0 "Things are finally moving forwards.\n\nPerhaps the locals have learned to love their new purpose."
 my_hoi4_mod_new_focus_tree_focus_33:0 "Snatch The Islands"
 my_hoi4_mod_new_focus_tree_focus_33_desc:0 "The Equestrians are still plenty distracted by the Changelings, now is a perfect time to strike at their soft underbelly."
 my_hoi4_mod_new_focus_tree_focus_34:0 "Calling all True Lunarists"
 my_hoi4_mod_new_focus_tree_focus_34_desc:0 "We can begin to pass word down more... concealed routes, that true Lunar loyalists can be found where we are, rather than in those lands ruled by the Chiropterran fools"
 my_hoi4_mod_new_focus_tree_focus_35:0 "Chiropterra Calling..."
 my_hoi4_mod_new_focus_tree_focus_35_desc:0 "It seems our \"Friends\" in New Ayacachtli have figured out what we're up to..."
 my_hoi4_mod_new_focus_tree_focus_36:0 "Creeping North"
 my_hoi4_mod_new_focus_tree_focus_36_desc:0 "The heretics southern coast is ripe for the taking.\n\nThe locals will inevitably resist, but to resist the nightmare is to resist the truth.\n\nThose who resist the truth are dealt with accordingly."
 my_hoi4_mod_new_focus_tree_focus_38:0 "A New Lunar Military"
 my_hoi4_mod_new_focus_tree_focus_38_desc:0 "In order for our cause to even stand a chance of coming out of this, we must immediately and rapidly organise ourselves into something better than this glorified warband."
 my_hoi4_mod_new_focus_tree_focus_39:0 "New Weapons for a New World"
 my_hoi4_mod_new_focus_tree_focus_39_desc:0 "If we are to stand a chance in what is to come we must prepare appropriately, our current equipment isn't nearly enough for that."
 my_hoi4_mod_new_focus_tree_focus_4:0 "Rapid Industrial Prepration"
 my_hoi4_mod_new_focus_tree_focus_42:0 "Focus on Production at home"
 my_hoi4_mod_new_focus_tree_focus_42_desc:0 "Having production off the books is great, but we still need some more immediately accessible factories."
 my_hoi4_mod_new_focus_tree_focus_43:0 "The Shadowbolt Connection"
 my_hoi4_mod_new_focus_tree_focus_43_desc:0 "The current Chairmare of the Shadowbolt society is an old associate of Midnight spirit's, it is in our interest to make use of that."
 my_hoi4_mod_new_focus_tree_focus_44:0 "Industrial Excellence"
 my_hoi4_mod_new_focus_tree_focus_44_desc:0 "We must prove that Thestral led industry is second to none!"
 my_hoi4_mod_new_focus_tree_focus_45:0 "Shadowbolt construction expertiese"
 my_hoi4_mod_new_focus_tree_focus_45_desc:0 "With our connection to the shadowbolts, it's time to start making use of it.\n\nThey have industrial expertiese we lack, it would be best to bolster ourselves with it."
 my_hoi4_mod_new_focus_tree_focus_46:0 "A Simple Correspondance"
 my_hoi4_mod_new_focus_tree_focus_46_desc:0 "A letter. Certainly a rarity in Nightmareist Puerto Caballo."
 my_hoi4_mod_new_focus_tree_focus_47:0 "Oversee the Work"
 my_hoi4_mod_new_focus_tree_focus_47_2:0 "A Deal to End All Deals"
 my_hoi4_mod_new_focus_tree_focus_47_2_desc:0 "That visit from Sour Sweet is due, surely it can only go well?"
 my_hoi4_mod_new_focus_tree_focus_47_desc:0 "We have become quickly efficient at putting the locals to work, it is time to take a look at how things are going in that regard."
 my_hoi4_mod_new_focus_tree_focus_48:0 "A War of Retribution"
 my_hoi4_mod_new_focus_tree_focus_48_desc:0 "In darkness, we have toiled\nIn darkness, we have waited\nNow, in broad daylight, we shall strike the sun down once and for all."
 my_hoi4_mod_new_focus_tree_focus_49:0 "New Blood"
 my_hoi4_mod_new_focus_tree_focus_49_desc:0 "With us no longer being in hiding, volunteers from many lands are coming to us, especially Chiropterra. This new blood will revitalize us."
 my_hoi4_mod_new_focus_tree_focus_4_desc:0 "To wait is to be the fool.\n\nIn the name of the Nightmare, we accelerate."
 my_hoi4_mod_new_focus_tree_focus_5:0 "Harsh Industrialisation"
 my_hoi4_mod_new_focus_tree_focus_51:0 "The Great Push"
 my_hoi4_mod_new_focus_tree_focus_51_desc:0 "The hour is upon us, every hoof must drive forwards, to erase the taint of the sun for good."
 my_hoi4_mod_new_focus_tree_focus_52:0 "The Homeland, Retaken"
 my_hoi4_mod_new_focus_tree_focus_52_desc:0 "At long last, Canterlot is in our hands, under the control of true loyalists of the nightmare. Alas, our work is not yet done."
 my_hoi4_mod_new_focus_tree_focus_53:0 "Loyalist Cells"
 my_hoi4_mod_new_focus_tree_focus_53_desc:0 "There are Thestrals loyal to the Nightmare all over Equestria, they will join us."
 my_hoi4_mod_new_focus_tree_focus_58:0 "Where is She???"
 my_hoi4_mod_new_focus_tree_focus_58_desc:0 "Everything is falling apart. Again. Just as quickly as things have been reclaimed, they slip from our grasp..."
 my_hoi4_mod_new_focus_tree_focus_59:0 "Our New Beginning"
 my_hoi4_mod_new_focus_tree_focus_59_2:0 "Restructuring"
 my_hoi4_mod_new_focus_tree_focus_59_2_desc:0 "First things first. Our government lacks so much basic structure that any organisation needs. Thankfully, the Shadowbolts can help fix this."
 my_hoi4_mod_new_focus_tree_focus_59_desc:0 "The dust hasn't settled at all, but we must go on to our new beginning."
 my_hoi4_mod_new_focus_tree_focus_5_desc:0 "The fact of the matter is, we must be harsh in our methods if we wish to succeed. All hooves must be geared solely towards our goal, lest we wish to fail."
 my_hoi4_mod_new_focus_tree_focus_60:0 "The New Way Forward"
 my_hoi4_mod_new_focus_tree_focus_60_2:0 "Bread And Circuses"
 my_hoi4_mod_new_focus_tree_focus_60_2_desc:0 "Things have changed, the people must be distracted from the chaos that currently is going on."
 my_hoi4_mod_new_focus_tree_focus_60_desc:0 "The way forward will be hard, can we stay true to our ideals?"
 my_hoi4_mod_new_focus_tree_focus_61:0 "The Nightmare"
 my_hoi4_mod_new_focus_tree_focus_61_2:0 "Industrial Primacy"
 my_hoi4_mod_new_focus_tree_focus_61_2_desc:0 "Industry must come first! After all, without industry, there's no profit to be made!"
 my_hoi4_mod_new_focus_tree_focus_61_desc:0 "The Nightmare remains our sole hope, we must go on.\n\n(This path is not finished and has no content.)"
 my_hoi4_mod_new_focus_tree_focus_62:0 "The Chairmare"
 my_hoi4_mod_new_focus_tree_focus_62_2:0 "Remove all Trace of \"Equestria\""
 my_hoi4_mod_new_focus_tree_focus_62_2_desc:0 "We have no need for the old symbols of \"Harmony\" and \"Equestria\"! They must be destroyed!"
 my_hoi4_mod_new_focus_tree_focus_62_desc:0 "Midnight's closest ally comes in to save us from ourselves... Again."
 my_hoi4_mod_new_focus_tree_focus_63:0 "The Other Way"
 my_hoi4_mod_new_focus_tree_focus_63_2:0 "Shadowbolt Economic Guidance"
 my_hoi4_mod_new_focus_tree_focus_63_2_desc:0 "Sour Sweet and her organisation know how to run an economy, let's leave that to them."
 my_hoi4_mod_new_focus_tree_focus_63_desc:0 "The way things are at present is untenable, however, there is perhaps a new, alternative, way ahead of us... Stalliongrad can't have been entirely wrong.\n\n(This path is not finished and has no content.)"
 my_hoi4_mod_new_focus_tree_focus_64_2:0 "The Nightmare to End All Nightmares"
 my_hoi4_mod_new_focus_tree_focus_64_2_desc:0 "Even in this darkness.\n\nThere is a hint of light."
 my_hoi4_mod_new_focus_tree_focus_65_2:0 "The New Equus"
 my_hoi4_mod_new_focus_tree_focus_65_2_desc:0 "The time has come to take stock of the road ahead..."
 my_hoi4_mod_new_focus_tree_focus_65_3:0 "Taking Stock Of The Situation"
 my_hoi4_mod_new_focus_tree_focus_65_3_desc:0 "The current situation is concerning, we must remedy it immediately"
 my_hoi4_mod_new_focus_tree_focus_66:0 "Finish off the Local Identity"
 my_hoi4_mod_new_focus_tree_focus_66_2:0 "Roll Over Stalliongrad"
 my_hoi4_mod_new_focus_tree_focus_66_2_desc:0 "Stalliongrad? A joke at best. We must crush these upstarts and be done with it.\n\nEradicate them."
 my_hoi4_mod_new_focus_tree_focus_66_desc:0 "A good step will be to crush whatever hints of an identity the locals have left, take their symbols, their rallying points."
 my_hoi4_mod_new_focus_tree_focus_67_2:0 "Changelings?"
 my_hoi4_mod_new_focus_tree_focus_67_2_desc:0 "The changelings provided a convinient distraction for us before, now, they stand as a hinderance. The time has come to be rid of them."
 my_hoi4_mod_new_focus_tree_focus_67_3:0 "Restrict The Ponies Movements"
 my_hoi4_mod_new_focus_tree_focus_67_3_desc:0 "We will further corral the locals into their worksites, movements between them will be halted for the time being."
 my_hoi4_mod_new_focus_tree_focus_68:0 "Crush Harmonist Insurrectionists"
 my_hoi4_mod_new_focus_tree_focus_68_2:0 "A Toast To Good Business!"
 my_hoi4_mod_new_focus_tree_focus_68_2_desc:0 "The conquest of the lands of the changelings makes for quite the boon, the locals are practically built for the labour we shall press them into. \n\nIt's just good business."
 my_hoi4_mod_new_focus_tree_focus_68_desc:0 "Agents of this island's former regime have been causing absolute chaos, refusing to accept the true way of things, their resistance must come to an end."
 my_hoi4_mod_new_focus_tree_focus_69_2:0 "Crush Communism"
 my_hoi4_mod_new_focus_tree_focus_69_2_desc:0 "We will ensure Stalliongrad never rises again."
 my_hoi4_mod_new_focus_tree_focus_69_3:0 "Eradicate Socialist Resistance"
 my_hoi4_mod_new_focus_tree_focus_69_3_desc:0 "The Socialists have been a wrench in our production lines for too long, The time has come to snuff them out."
 my_hoi4_mod_new_focus_tree_focus_7:0 "Put The Non-Thestrals To Work!"
 my_hoi4_mod_new_focus_tree_focus_70:0 "Expand Local Garrisons"
 my_hoi4_mod_new_focus_tree_focus_70_2:0 "The Truth..."
 my_hoi4_mod_new_focus_tree_focus_70_2_desc:0 "Not all is as it seems.\n\nSomeone has been a pawn in a bigger pony's game."
 my_hoi4_mod_new_focus_tree_focus_70_desc:0 "By expanding local scale garrisons, we can hopefully be more ready and able to handle the local resistance"
 my_hoi4_mod_new_focus_tree_focus_71:0 "Recruit Native Informants"
 my_hoi4_mod_new_focus_tree_focus_71_desc:0 "Some of the locals are more than willing to collaborate with us, we should make use of this."
 my_hoi4_mod_new_focus_tree_focus_72:0 "Provide Basic Necessities"
 my_hoi4_mod_new_focus_tree_focus_72_desc:0 "Basic rations would go a long way in quelling a lot of the problems we're facing, it's about time we organised such things"
 my_hoi4_mod_new_focus_tree_focus_73:0 "Rations For High Performers"
 my_hoi4_mod_new_focus_tree_focus_73_desc:0 "Performance incentives will encourage our laborers to work harder, might as well do it, it's no different from one of our pay bonuses after all."
 my_hoi4_mod_new_focus_tree_focus_74:0 "Extend the crackdown"
 my_hoi4_mod_new_focus_tree_focus_74_desc:0 "The ponies must learn to kneel, and clearly they have chosen the hard way."
 my_hoi4_mod_new_focus_tree_focus_75:0 "A New Control Method"
 my_hoi4_mod_new_focus_tree_focus_75_desc:0 "We have done enough, there is no need to continue senselessly killing our own workforce"
 my_hoi4_mod_new_focus_tree_focus_76:0 "Finish this Nonsense"
 my_hoi4_mod_new_focus_tree_focus_76_desc:0 "Things are finally in order... We can get back to the real work now."
 my_hoi4_mod_new_focus_tree_focus_77:0 "The State Of The Nightmareist Military"
 my_hoi4_mod_new_focus_tree_focus_77_desc:0 "Our military is in utter shambles, the time has come to fix this"
 my_hoi4_mod_new_focus_tree_focus_78:0 "Found the TLI"
 my_hoi4_mod_new_focus_tree_focus_78_desc:0 "The Thestral Light Infantry, or the TLI, will form the backbone of our military for the grand task of reclaiming our homeland."
 my_hoi4_mod_new_focus_tree_focus_79:0 "Thestral Air Corps"
 my_hoi4_mod_new_focus_tree_focus_79_desc:0 "The Thestral Air Corps is a new concept, one we must turn into a reality. In time, they will rule the skies of Equus."
 my_hoi4_mod_new_focus_tree_focus_7_desc:0 "The ponies are of little use to us, not to mention the other minorities in our lands. We can fix that, they will work, they will toil so that we, the Nightmare's chosen, can rule once more."
 my_hoi4_mod_new_focus_tree_focus_8:0 "Crush The Local Identity"
 my_hoi4_mod_new_focus_tree_focus_80:0 "The Grand Thestral Navy"
 my_hoi4_mod_new_focus_tree_focus_80_desc:0 "A state as grand as one ruled by Thestralkind requires an equally grand navy."
 my_hoi4_mod_new_focus_tree_focus_81:0 "Firearms Innovations"
 my_hoi4_mod_new_focus_tree_focus_81_desc:0 "We must develop the very weapons we put in the hands of our soldiers, letting them fall behind will spell death for us all"
 my_hoi4_mod_new_focus_tree_focus_82:0 "Produce Our Own Tracked Death Machines"
 my_hoi4_mod_new_focus_tree_focus_82_desc:0 "The use of heavy tanks has been with us since as far back as our early days as mercenaries, we should lean on this strongpoint."
 my_hoi4_mod_new_focus_tree_focus_83:0 "Cruisers For The Cause"
 my_hoi4_mod_new_focus_tree_focus_83_desc:0 "Whilst far from the glorious battleships we aspire to command, cruisers are far more within our reach, and as such will prove vital to the path ahead"
 my_hoi4_mod_new_focus_tree_focus_84:0 "Nautical Aviation Experiments"
 my_hoi4_mod_new_focus_tree_focus_84_desc:0 "We have that carrier left from the fools that used to rule this island, we should probably learn to use the thing."
 my_hoi4_mod_new_focus_tree_focus_85:0 "New Pilot Training"
 my_hoi4_mod_new_focus_tree_focus_85_desc:0 "We've not had access to planes until now, we need to get trained pilots ready to fly as soon as possible"
 my_hoi4_mod_new_focus_tree_focus_86:0 "Airborne Death Machines"
 my_hoi4_mod_new_focus_tree_focus_86_desc:0 "Whilst not as important as fighter aircraft, larger close air support planes are important if we are to truly crush our enemies"
 my_hoi4_mod_new_focus_tree_focus_87:0 "Fighters Of The Nightmare"
 my_hoi4_mod_new_focus_tree_focus_87_desc:0 "The backbone of all air forces are fighters, ours will be second to none."
 my_hoi4_mod_new_focus_tree_focus_88:0 "Obliteration From Above"
 my_hoi4_mod_new_focus_tree_focus_88_desc:0 "Our enemies will dig in, thankfully, from the skies, we can see them pounded to dust."
 my_hoi4_mod_new_focus_tree_focus_89:0 "Carrier Trials"
 my_hoi4_mod_new_focus_tree_focus_89_2:0 "Our Enemy's Enemy."
 my_hoi4_mod_new_focus_tree_focus_89_2_desc:0 "Naturally, it is only right we look to the enemies of Equestria for assistance, or at the very least, some kind of agreement to not bomb one another to tartarus."
 my_hoi4_mod_new_focus_tree_focus_89_desc:0 "Whilst perhaps beyond our current means, putting some thought into carriers for the future can only be a good thing."
 my_hoi4_mod_new_focus_tree_focus_8_desc:0 "These local Puerto Cabellans must learn their place. We will start with their cities."
 my_hoi4_mod_new_focus_tree_focus_90:0 "Dreadnoughts Of The New Age"
 my_hoi4_mod_new_focus_tree_focus_90_2:0 "Our Friend?"
 my_hoi4_mod_new_focus_tree_focus_90_2_desc:0 "With everything considered, perhaps it's about time we formalised things with the Changelings beyond more than just agreeing to not bomb each other into the stone age."
 my_hoi4_mod_new_focus_tree_focus_90_desc:0 "Battleships are, frankly, a pipe dream at present, but in due time, we can realise them, and then turn their guns upon those who dare defy us at sea."
 my_hoi4_mod_new_focus_tree_focus_91:0 "Streamlined Artillery and Firearms Production"
 my_hoi4_mod_new_focus_tree_focus_91_2:0 "Formalise the Vraks Accord"
 my_hoi4_mod_new_focus_tree_focus_91_2_desc:0 "The Changelings have seen the value in forming a unified front with us against the vile Equestrians, it is almost time for us to act..."
 my_hoi4_mod_new_focus_tree_focus_91_desc:0 "Streamlining production of artilery and basic firearms is simply a must, given they are the very backbone of the TLI."
 my_hoi4_mod_new_focus_tree_focus_92:0 "Early Mechanization"
 my_hoi4_mod_new_focus_tree_focus_92_2:0 "Our gallant allies in the west"
 my_hoi4_mod_new_focus_tree_focus_92_2_desc:0 "Our It seems that the Changelings aren't going to run us down as Flawless feared, thank the Nightmare..."
 my_hoi4_mod_new_focus_tree_focus_92_desc:0 "In the modern era, more and more nations are making use of motor vehicles in battle, we should prepare to do the same, we already do for our mercenary cohorts."
 my_hoi4_mod_new_focus_tree_focus_93:0 "A Real Military"
 my_hoi4_mod_new_focus_tree_focus_93_2:0 "Another Way"
 my_hoi4_mod_new_focus_tree_focus_93_2_desc:0 "Thankfully, there's a way out of all this... A shining cyan light at the end of the tunnel..."
 my_hoi4_mod_new_focus_tree_focus_93_desc:0 "At last, we can claim to be more than a ragtag band of mercenaries pretending to be a military force"
 my_hoi4_mod_new_focus_tree_focus_94:0 "The Chairmare's Newest Acquisition"
 my_hoi4_mod_new_focus_tree_focus_94_desc:0 "Darkness is all that awaits us, we are all puppets upon a profiteer's string."
 my_hoi4_mod_new_focus_tree_focus_95:0 "Removing Shadowbolt Influence"
 my_hoi4_mod_new_focus_tree_focus_95_desc:0 "The Changelings have come to our aid! It is time to cut this disease out of our state before it becomes overwhelming!"
 my_hoi4_mod_new_focus_tree_focus_96:0 "Deepen Ties"
 my_hoi4_mod_new_focus_tree_focus_96_desc:0 "Given everything, we owe much to the Changelings in the West, we should aim for closer relations with them."
 my_hoi4_mod_new_focus_tree_focus_97:0 "Continue the arrangement"
 my_hoi4_mod_new_focus_tree_focus_97_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_98:0 "Never Another Backstab"
 my_hoi4_mod_new_focus_tree_focus_98_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_99:0 "An Army of Mercenaries"
 my_hoi4_mod_new_focus_tree_focus_99_desc:0 "Describe this focus."
 fotn_what_lies_ahead:o "What Lies Ahead"
 fotn_what_lies_ahead_desc:0 "And so we reach another fork in the road... We must decide our future once again."