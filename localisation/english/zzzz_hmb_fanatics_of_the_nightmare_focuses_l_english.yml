l_english:
 FOTN_new_focus_tree_focus_1:0 "It Begins"
 FOTN_new_focus_tree_focus_1_desc:0 "And so... The plot begins to reach it's final stage..."
 fanatics_of_the_nightmare_new_focus_tree_2_focus_7_copy:0 "A Fate Most Foul"
 fanatics_of_the_nightmare_new_focus_tree_2_focus_7_copy_desc:0 "Describe this focus."
 fanatics_of_the_nightmare_new_focus_tree_2_focus_8_copy:0 "A Fate Most Blessed"
 fanatics_of_the_nightmare_new_focus_tree_2_focus_8_copy_desc:0 "Describe this focus."
 fanatics_of_the_nightmare_new_focus_tree_focus_121:0 "Happiness, Finally"
 fanatics_of_the_nightmare_new_focus_tree_focus_121_desc:0 "After so long... So much work... Even the likes of Lord Marshal Midnight can find some glimmer of light."
 fanatics_of_the_nightmare_new_focus_tree_focus_122:0 "Requesting Her Blessing"
 fanatics_of_the_nightmare_new_focus_tree_focus_122_desc:0 "Whilst in the empire, all are free to marry whomever they wish, Changeling society is rather different, it's best to ask Chrysalis for her blessing on this matter."
 fanatics_of_the_nightmare_new_focus_tree_focus_123:0 "Final Preprations"
 fanatics_of_the_nightmare_new_focus_tree_focus_123_desc:0 "A few little details remain, then, a bright future lies ahead"
 fanatics_of_the_nightmare_new_focus_tree_focus_124:0 "A Union Most Wonderful"
 fanatics_of_the_nightmare_new_focus_tree_focus_124_desc:0 "The day is upon us, The Lord Marshal will at long last marry Hive Queen Yaria of Soryth"
 fanatics_of_the_nightmare_new_focus_tree_focus_125:0 "A Fate Most Blessed"
 fanatics_of_the_nightmare_new_focus_tree_focus_125_2:0 "Aquileia's Little Island"
 fanatics_of_the_nightmare_new_focus_tree_focus_125_2_desc:0 "After the revolution an ocean away, it seems we have one last flicker of the Aquileian monarchy right under our noses..."
 fanatics_of_the_nightmare_new_focus_tree_focus_125_desc:0 "Even the worst can go on to do better."
 fanatics_of_the_nightmare_new_focus_tree_focus_126:0 "A Fate Most Foul"
 fanatics_of_the_nightmare_new_focus_tree_focus_126_2:0 "Going North"
 fanatics_of_the_nightmare_new_focus_tree_focus_126_2_desc:0 "There's still parts of Eastern Equus that remain outside our control, this must be remedied."
 fanatics_of_the_nightmare_new_focus_tree_focus_126_desc:0 "In the end, the past catches up with us all..."
 fanatics_of_the_nightmare_new_focus_tree_focus_127:0 "Opening The Gates to Gold"
 fanatics_of_the_nightmare_new_focus_tree_focus_127_desc:0 "A grand plan lies ahead, we need only kick in the front door to permit it to begin."
 fanatics_of_the_nightmare_new_focus_tree_focus_128:0 "Industrial Hub Cities"
 fanatics_of_the_nightmare_new_focus_tree_focus_128_desc:0 "We must continue to expand our production, a number of cities have been selected to have the honor of being the hubs of said expansion."
 fanatics_of_the_nightmare_new_focus_tree_focus_129:0 "Send the Birds Back to Griffonia"
 fanatics_of_the_nightmare_new_focus_tree_focus_129_desc:0 "Griffons have no place on Equus. It is a simple fact. The time has come to boot them back to their own cesspit of a continent."
 fanatics_of_the_nightmare_new_focus_tree_focus_130:0 "Crush the Imbecile Yaks"
 fanatics_of_the_nightmare_new_focus_tree_focus_130_desc:0 "The Yaks are a brainleThe Yaks are not the brightest bunch... Alas, they are a tough, hardy people, wearing them down will not be easy.\n\nEven so. The task must be undertaken."
 fanatics_of_the_nightmare_new_focus_tree_focus_131:0 "Another Trip to The Desert"
 fanatics_of_the_nightmare_new_focus_tree_focus_131_desc:0 "Dreadful as it is, the desert has always called to us, one way or another. One more romp through it will do no harm."
 fanatics_of_the_nightmare_new_focus_tree_focus_132:0 "Further Naval Expansion"
 fanatics_of_the_nightmare_new_focus_tree_focus_132_desc:0 "The Grand Thestral Navy is always in need of more vessels, we require the means to produce more of them."
 fanatics_of_the_nightmare_new_focus_tree_focus_133:0 "Expand the Joint Research Program"
 fanatics_of_the_nightmare_new_focus_tree_focus_133_desc:0 "Our work with the Changelings has been nothing but fruitful, especially our work with the researchers of Soryth, which the Lord Marshal seemingly has a personal interest in.\n\nThe time has come to expand it."
 fanatics_of_the_nightmare_new_focus_tree_focus_134:0 "Those Other Birds"
 fanatics_of_the_nightmare_new_focus_tree_focus_134_desc:0 "The Penguins of the North are easily forgotten. As they should be.\n\nTheir rule will be nothing but a memory, one that will be forgotten swiftly."
 fanatics_of_the_nightmare_new_focus_tree_focus_135:0 "Mazwi's Unpaid Debts"
 fanatics_of_the_nightmare_new_focus_tree_focus_135_desc:0 "Mazwi owes us, it's time to collect, whether they're still around or not."
 fanatics_of_the_nightmare_new_focus_tree_focus_136:0 "Modern Construction Methods"
 fanatics_of_the_nightmare_new_focus_tree_focus_136_desc:0 "With our focus on weapons production and research, we've let our construction methods fall behind, it's time to bring them up to par with the current day."
 fanatics_of_the_nightmare_new_focus_tree_focus_137:0 "Meridennes Naval Yard"
 fanatics_of_the_nightmare_new_focus_tree_focus_137_desc:0 "With the Meridennes under our control, it's time to shape them for our purposes. The isles shall make for one excellent, gargantuan naval yard."
 fanatics_of_the_nightmare_new_focus_tree_focus_138:0 "In the Lair of Dragons"
 fanatics_of_the_nightmare_new_focus_tree_focus_138_desc:0 "One final bastion of Harmony remains on this continent. The Dragons.\n\nWe must decide how we move forwards with dealing with them."
 my_hoi4_mod_new_focus_tree_1_:0 "Happiness, Finally"
 my_hoi4_mod_new_focus_tree_1__desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_2_focus_2_copy:0 "Requesting Her Blessing"
 my_hoi4_mod_new_focus_tree_2_focus_2_copy_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_2_focus_4_copy:0 "Stall The Changelings"
 my_hoi4_mod_new_focus_tree_2_focus_4_copy_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_2_focus_7_copy:0 "A Union Most Wonderful"
 my_hoi4_mod_new_focus_tree_2_focus_7_copy_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_100:0 "Changeling - Thestral Exchange Program"
 my_hoi4_mod_new_focus_tree_focus_100_desc:0 "Our dear friends in Changelingia have plenty to learn from us and vice versa, it is only right that we both learn from one another."
 my_hoi4_mod_new_focus_tree_focus_101:0 "The Changeling Military Model"
 my_hoi4_mod_new_focus_tree_focus_101_desc:0 "There is much for us to learn from the post-war Changeling military, adoption of some of their methods will do wonders."
 my_hoi4_mod_new_focus_tree_focus_102:0 "The Grudge Match of the Century"
 my_hoi4_mod_new_focus_tree_focus_102_desc:0 "A simple grudge is usually harmless. But when that grudge is held by a ruler no less? \n\nA terrible fate awaits those who drew the ire of the Lord Marshal"
 my_hoi4_mod_new_focus_tree_focus_103:0 "Legalise Looting"
 my_hoi4_mod_new_focus_tree_focus_103_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_104:0 "Retain some faith at least"
 my_hoi4_mod_new_focus_tree_focus_104_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_105:0 "Midnight Spirit's Last Laugh"
 my_hoi4_mod_new_focus_tree_focus_105_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_106:0 "The Wayward Colony"
 my_hoi4_mod_new_focus_tree_focus_106_desc:0 "Celestia thinks running off to New Mareland will save her and her dearest Harmony. \n\nLet's turn that land into a killbox. It's the very birthplace of our leader after all..."
 my_hoi4_mod_new_focus_tree_focus_107:0 "Ascent of the Lord-Marshal"
 my_hoi4_mod_new_focus_tree_focus_107_desc:0 "Our own way forward lays ahead, the time has come to solidify it once and for all."
 my_hoi4_mod_new_focus_tree_focus_108:0 "The Nightmare abandoned us, Chrysalis did not"
 my_hoi4_mod_new_focus_tree_focus_108_desc:0 "The facts are simple.\n\nThe Nightmare didn't want us. She turned on the only ones willing to make her realm real... We must go our own way."
 my_hoi4_mod_new_focus_tree_focus_109:0 "Changelings, True Friends to All Thestralkind"
 my_hoi4_mod_new_focus_tree_focus_109_desc:0 "It's been a damned good run, and whilst there's still work to be done, a break of some magnitude is in order."
 my_hoi4_mod_new_focus_tree_focus_110:0 "Our Base in Zebrica"
 my_hoi4_mod_new_focus_tree_focus_110_desc:0 "At long last, the pretenders in Chiropterra are no more. But it remains a land of Thestrals, and it will be intergrated."
 my_hoi4_mod_new_focus_tree_focus_111:0 "A New and Model Thestral Domain"
 my_hoi4_mod_new_focus_tree_focus_111_desc:0 "With Celestia and her ilk out of the way, the time has come to turn Thestralia into what it always should have been.\n\nA land of Thestrals, for Thestrals, by Thestrals."
 my_hoi4_mod_new_focus_tree_focus_112:0 "The Shadowbolt Plot goes as planned"
 my_hoi4_mod_new_focus_tree_focus_112_desc:0 "Describe this focus."
 my_hoi4_mod_new_focus_tree_focus_113:0 "Corporate Security Forces"
