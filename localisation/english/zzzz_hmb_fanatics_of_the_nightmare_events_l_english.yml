l_english:
 ascent_fotn.1.a:0 "Because beneath it all, she was proud."
 ascent_fotn.1.d:0 "Countless Thestrals, and Changelings, occupied the throne room of Canterlot. On both sides of the throne, crowds had gathered for the event set to take place, all the while, stood before the throne, towered over by it, was Midnight Spirit. Clad not in the trappings of a mercenary, but in cloths befitting a ruler... All clearly stolen from Severyanans of all things. Even so, nopony dared bat an eye at it.\n\nTime passed... The Field Marshal remained, stood firmly in place. Not faltering. Not breaking into some fit of mania as he may have once done. He stood and he waited. In time, his sister moved to approach the throne he stood before, carrying something draped over with a thick black cloth. The mare stood before her own brother, offering a sharp and swift salute before passing the object into his hooves. Midnight would run a hoof along the length of it, before pulling the cloth from it finally.\n\nThe moment he did so, an ornately decorated sabre would be revealed, a sabre which he would swiftly raise above head height, holding it up for all to see, only for Flawless to begin speaking.\n\n\"Upon taking up this blade, you, Midnight Spirit, are to become Lord-Marshal of the Nightma-\" She'd go to say, only to be cut off by Midnight himself, who shook his head at her words, drawing some measure of shock from the gathered masses.\n\n\"Upon taking up this blade, I, Midnight Spirit, am to become Lord-Marshal not of any empire dedicated to any deity, but Lord Marshal of the Thestral Empire of East Equus!\" He'd roar out, lowering the sabre from on high, and affixing it to the belt he was wearing.\n\n\"On this day, I, Midnight Spirit, stand here before my people, Thestralkind itself, and our allies, the Changelings of Changelingia! And I swear on this day that I, and those who take up this blade after me, will see to it that never again our we, the trampled children of the night, are to be cast into the darkness again. Never again will we kneel, nor bend, we will at last rule our lands guided not by any goddess, but by the merit of ourselves and ourselves alone!\"\n\nThe onlookers roared up in a cacophony of praise, and Midnight stepped back, taking the seat that was now his... All the while Flawless stood there, glaring, but not uttering a single word."
 ascent_fotn.1.t:0 "Ascent of The Lord Marshal"
 asimplecorrespondance.1.a:0 "\"Flawless!! Fetch me one of the writing ponies, immediately!\""
 asimplecorrespondance.1.d:0 "\"Brother.\" Flawless Spirit would state bluntly, entering the ramshackle space that Midnight had converted into an office. Before the takeover, the room was a prison cell, given the building itself was once a police station. Even so, the mare stepped over, sliding a letter onto his desk with her hoof. \"This was delivered, your eyes only supposedly. I know better than to poke my snout into things with Shadowbolt insignia on them.\"\n\n\"Sister.\" He'd respond coldly, eye peering over the envelope upon his desk, noting the aforementioned mark of the Shadowbolts on it. \"So it's a business delivery, still, impressive it managed to get here, all things considered.\" He'd snort, before lifting one hoof to begin opening it. \"You may leave now, Flawless.\"\n\nFlawless didn't speak, merely offering her brother a swift salute, before the iron bars of the door rolled shut. In turn, he finally managed to get the envelope open after some fumbling around with it.\n\n\"To the Illustrious Field Marshal Midnight Spirit. I am pleased to see that our initial arrangement has proven fruitful, the experts I had dispatched to the little backwater you currently occupy have reported exponential industrial and economic growth since their arrival. I do hope that their addition to your retinue has proven to be most helpful.\"\n\n\"That all stated, I am rather curious to see what facilities they are working with, perhaps transport to Puerto Caballo can be arranged? I would hope you and yours are able to provide such for a business partner, no? Myself and others among the Shadowbolt Society are watching your little fiefdom with quite the keen eye. Mayhaps we could discuss it's future over drinks?\"\n\n\"Nightmare preserve, Chairmare Sour Sweet.\"\n\nMidnight's eye lit up for a moment as he read the contents of the letter, before he bolted out of his seat, his voice bellowing out from his office..."
 asimplecorrespondance.1.t:0 "A simple correspondance"
 aunion.1.a:0 "\"I intend to pursue a closer union between §Cmyself§! and §GYaria.§!\""
 aunion.1.d:0 "\"Our longstanding relationship with the Changelings is a great thing, Flawless.\" Midnight grumbled from behind his desk, his sister pacing back and forth in front of it. \"This has genuinely done a lot for our people, you can't deny that.\"\n\nFlawless just shook her head. \"At the cost of so much. Somewhere along the way, I wonder if you forgot the nightmare even existed... Forgot why we did this to begin with.\" Flawless sighed.\n\"I didn't forget, sister. I wasn't given a choice. The Nightmare made plenty clear, the things we'd done in her name were beyond redemption. I had to find us a new path...\" Midnight sighed in turn, letting the faint blueish glow from the end of his cigarette illuminate his face in the otherwise dark office. \"Like it or not, Flawless, this gig we've got with the Changelings, it's here to stay... Now, I won't force you to accept what I suggest next, but I expect you to respect my decision...\""
 aunion.1.t:0 "A surprise"
 aunion.3.a:0 "\"But it is the kind of thing best said face to face.\""
 aunion.3.d:0 "For once, the light in Midnight Spirit's office was on. Any other time, this would be seen as a bad sign, yet the beaming grin on the batpony's face made clear that such wasn't the case. An earthpony was sat next to his desk, not in chains, not even seemingly under any duress, seemingly writing at the Lord Marshal's behest, given his enduring inability to do so himself.\n\n\"To the most excellent envoy, Hive Queen Yaria.\n\n\"I am delagating this serving pony to write a rather... Personal request, not as Lord Marshal to Hive Queen, rather just as Midnight Spirit to Yaria. I am plenty sure you have Nightmare knows how many matters of far greater import to attend to, of course, but if you'd at the very least humor a humble request...\"\n\n\"As I'm sure you know, we have been working together for... Quite some time. I admittedly have lost track of the years now. When we signed the Vraks Accord, it was considered an act of necessity for the preservation of my own people. A particularly foolish final attempt at making something of what I had you could say. And yet you humored it. Sure, at the time, it was business. A glorified mercenary contract, the long term kind.\"\n\n\"Regardless of all that, the point I am trying to make is, you have done a lot for me, for my people, for your own people too. Together we brought an end to not only the ugly thing that was Equestria, but the vile, communist ilk of Stalliongrad. Our armies rule from coast to coast, we rule from coast to coast.\"\n\n\"The request I had in mind was that, perhaps, maybe, the time has come to finally make a particularly open show of unity between our peoples...\""
 aunion.3.t:0 "The Lord Marshal and The Queen of Soryth"
 aunion.4.a:0 "\"Yes, Midnight, I accept.\""
 aunion.4.d:0 "A small, somewhat modest boat floated upon the cold, frozen waters of Key Lake, the lights of the surrounding city, Soryth, illuminated the waves beneath it.\n\n\"Thank you... for humoring me. Yaria.\" Midnight would speak, the Lord Marshal's voice lacking the usual power that he always tried to maintain. It was much more simple, plain even.\n\nStood at his side, towering over the rather small Thestral, was Yaria, looking down at him with the faintest of grins, the changeling's own fangs glimmering in the faint light as she did so. \"All things considered, this was but a small ask, Midnight Spirit\" she'd respond, only to be met with a shake of the stallion's head, yet there was a smile on his face.\n\n\"No, Yaria, this isn't a small ask, rather, it's the biggest ask I think I've ever made of you, and I've made a few... and it's just Midnight to you, we are equal enough in our service to Chrysalis after all, no?\"\n\nMidnight's words were met with an eyebrow raise, not only in response to his comment about Chrysalis, but also to his suggestion that this was perhaps a larger ask than she'd thought. Even so, the Hive queen didn't shift, remaining where she stood, before she finally spoke. \"Perhaps so, Midnight. But you remain illusive in regards to what this ask of yours actually is, how am I to know if it is as large as you suggest it is in such case?\"\n\nThe usually composed and confident Midnight almost faltered in that moment, but he'd come too far to back down now, doing so could do far more harm than asking at this point in fact, given who it was he was speaking with. It took him a moment, but after a sigh, the one eyed batpony looked up, his gaze meeting Yaria's, refusing to break from it.\n\n\"Yaria I... I am asking if you would marry me. After all this time, these years, I came to realise something. Somewhere down the line during our work in Chrysalis's name, I found myself caring for you more than things I should perhaps care much more for. I found myself loving... You. It's stupid, and perhaps I'm a fool for even thinking to ask, but you miss every shot you don't take, and I tend to pride myself in not missing shots...\"\n\nMidnight fell silent after that, whatever confidence he'd managed to seize in that moment abandoned him, and now all he could do was wait as Yaria mulled it over..."
 aunion.4.t:0 "A night on Key Lake"
 chiropterra_calling.1.a:0 "The traitors will be handled... In time"
 chiropterra_calling.1.d:0 "Midnight sat within his office, now barely resembling the prison cell it once was, now Nightmareist banners were draped across the walls, one even hung from his desk. But the desk was still simple, decorated only with his old, officer issue revolver and a singular picture frame, but what was within it could only be seen from his side of the desk. Though, what he thought was a gust of wind blew through the room, knocking it down, which led to him frantically moving to put it back in it's place, only to then realise it was no gust of wind, it was his sister knocking it to get his attention.\n\n\"What is it, Flawless?\" He asked, a slight look of displeasure upon his face as he spoke, not particularly pleased to have been interrupted during one of his frequent bouts of zoning out.\n\n\"Another letter. One we're a bit more familiar with.\" She'd snort. \"Chiropterran.\"\n\n\"You mean to say they've finally realised what's going on here?\" Midnight would question. \"Who brought that here? Are they still here?\"\n\nHis questions were met only with a nod, and then a shake of the mare's head, followed by a sigh. \"Read it.\"\n\nHe didn't have to fumble with an envelope this time, Flawless had already handled that for him.\n\n\"To the disgraced Field Marshal Midnight Spirit and his cohort. We have become rather aware of your somewhat recent actions in Puerto Caballo, as well as the policies which you are imposing upon the local populace. It is with great joy that I am able to write that Chiropterra and all true followers of her majesty the Nightmare condemn you, those alongside you, and your actions.\"\n\nMidnight went to toss the letter away there and then, but the look on Flawless's face said it all, she knew he'd not finished it, and she was right, he hadn't, there was a second, different letter attached to it, one that bore no insignia at all, nor a signature.\n\n\"Whilst we cannot express so openly, some of us back here in Chiropterra have not forgotten about you, Midnight, or your words of great wisdom. I cannot disclose who I am, for doing so would put myself and many other true Nightmareists at risk. But know, even in this overwhelming brightness, there is still some shade to be found. In time, you will be able to stand in it alongside old friends. Until then, keep up the great work. Nightmare preserve.\""
 chiropterra_calling.1.t:0 "Chiropterra calling..."
 deathofmidnight.1.a:0 "The Lord Marshal is dead..."
 deathofmidnight.1.d:0 "Midnight could barely see, moments after drinking from his flask everything went black. He already knew what was going on, one final cruel joke from his past finally came back to haunt him. \n\n\"So this is how it goes...\" Midnight managed to mumble out. Already, Flawless was where she'd always been, by his side looking on in horror. But for the first time the horror wasn't perpetuated by him, it was inflicted upon him. A loud gutteral wheeze left Midnight before he spoke on. \"The past catches us all in the end.. Even if we stray from the harm we once did...\"\n\nBy this point, panic had begun to set in amongst the attendees, someone had already gotten hold of the pony that brought him his flask, and all Yaria and Thistle could do was look down in shock as the Lord Marshal grew paler than he already was. \"Brother I...\" Flawless squealed, but all Midnight did in turn was manage to force a smile.\n\n\"Sometimes... Sometimes we get what we deserve, even when it's long overdue... So that those who come after may make things right...\" He'd mumble, clinging to what life he had left in that moment, he managed to shift his head, looking to Yaria. \"I'm sorry our day has been ruined the way it has... But...\" \n\nWhat followed was something spoken in fluent changeling, rather than his own language. \"I die knowing what true contentment is thanks to you, Yaria...\"\n\nAnd with those final, near alien words..."
 deathofmidnight.1.t:0 "The Death of the Lord Marshal"
 dergultimatum.1.a:0 "Annexation is preferable, give them no choice."
 dergultimatum.1.b:0 "Let's reach out, there's a deal to be made here."
 dergultimatum.1.d:0 "Our conquest of Eastern Equus is undisputable, however, one matter remains... The matter of the dragons and their lands. What should we do about them?"
 dergultimatum.1.t:0 "The Lair of Dragons"
 dergultimatum.2.a:0 "So be it."
 dergultimatum.2.d:0 "The Dragons have refused our offer, thus the time has come to put an end to them!"
 dergultimatum.2.t:0 "The Dragons Refuse!"
 dergultimatum.3.a:0 "It is good that they saw sense."
 dergultimatum.3.d:0 "The Dragons have conceded to our demands, thankfully... No Thestrals need to die for their worthless isle today."
 dergultimatum.3.t:0 "The Dragons Agree!"
 direstraits.1.a:0 "\"I hope he's got some Kirin beer down there...\""
 direstraits.1.d:0 "It was a late evening, the only light illuminating Midnight Spirit's office was the faint ember of a burning cigarette which had been set down upon his desk, all the while, Midnight himself had dozed off. At least, he had dozed off until he was awoken by the sound of his office door sliding open, and then the Half-Kirin Thistle Torch stepped in, the metal of the door clanging shut behind her.\n\n\"Midnight, I think you may want to read this repo-\" She spoke in her usual soft spoken tone, only to be swiftly cut off by Midnight's own, much harsher one. \"Put it in front of me, now.\" he'd bark out, and it was an order which Thistle quickly complied with, laying the entire report there for him to see.\n\n\"Socialist resistance in the west, Harmonist in the east... Ration shortages also...\" Midnight mumbled under his breath, taking stock of the situation which had been put before him. \"Why did you bring this to me instead of seeing to it yourself?\" He'd ask, a raised brow directed towards Thistle. \n\n\"You're the only one with the authority to-\" She went to explain, only to be cut off again as per the usual. Midnight didn't even let her finish. \"I vividly recall making it known that in circumstances like this, the chain of command is perfectly capable of being ignored so long as it gets results? Or did I not say that?\"\n\nThistle nodded along in silent acceptance. \"Yes sir, you did say that sir.\" she murmured, only to be met with a loud snort from the Thestral sat behind a desk before her. \"Still... It is good you have brought this to my attention, now I suggest you see to fixing it. Oh, and raid the drink stash in the basement, it's on me.\"\n\nThat was all he had to say, and so, he waved a hoof to dismiss the Half-Kirin, which in turn was met with a salute and a swift departure..."
 direstraits.1.t:0 "Dire straits..."
 fotn_eqg_whitepeace.1.a:0 "Accept"
 fotn_eqg_whitepeace.1.t:0 "eqg white peace"
 fotn_wedding.1.a:0 "\"I do!\""
 fotn_wedding.1.d:0 "Midnight never was one for all the fancy glamour that came with events like this, sure, his uniform was always decorated in quite the gaudish manner, but this? This was something new. Something he wasn't too fond of. Still, it would be worth it. He'd spent bits upon bits on this entire thing, and he'd not waste them now. He'd found a Thestral to officiate the whole thing, a Nightmareist no less, one Word Bearer, supposedly a figure with quite some following in Nightmareist circles these days. He didn't mind it, even if he'd renounced his own faith, when he swore to all Thestralkind at the coronation, he meant it. Even the Nightmareists were still his people.\n\nAnd so he stood there at the end of a long aisle, purple and cyan carpet running right down it, it almost looked like the flag that they'd flown over Puerto Caballo all those years ago. He couldn't help but grin, looking to Word with his one eye, giving the fellow Thestral a nod. \"I appreciate this, you know. I know this entire thing is likely heretical on so many levels in your eyes... But I don't forget where I came from, and as such, only one as faithful to the Nightmare as yourself could ever do the job that you are going to do.\"\n\nThe other Thestral nodded in turn, even he towered over Midnight, it was certainly an amusing sight. \"You may have renounced your faith, yes, but there is still hope for us all under Her Majesty the Nightmare.\"\n\nMidnight would have likely spouted some retort at that, alas, he wouldn't have the chance. Music began to roar out from a lone piano in the corner, and thus he quickly bolted upright proper from his usual slouched stance, eye set forwards as if he was stood at attention on a parade square. Needless to say, the Changelings amongst the crowd were roaring with cheer as Yaria began her approach. Once she finally made it to the very same spot Midnight was stood at, she turned to face the one eyed, wingless Thestral with a fanged smile, one which was matched by him without even a moment's thought.\n\nWord began to recite a number of Nightmareist theological statements, ones that Midnight knew, but admittedly didn't care for, even so, even the Lord Marshal didn't interfere. Of all the times for him to interfere, now wasn't one of them. Something that his sister, Flawless, could tell was going through his head from the crowd, and she could only nod in approval. Before long, Word Bearer finally spoke up in a way that needed Midnight's attention.\n\n\"Do you, Lord Marshal Midnight Spirit, agree to be bound under her sacred moonlight to Hive Queen Yaria?\" Word would ask slowly. Midnight, meanwhile didn't let a mere moment pass before blurting out his response."
 fotn_wedding.1.t:0 "The awaited hour"
 fotn_wedding.2.a:0 "Letting out a cheer of his own"
 fotn_wedding.2.b:0 "Suddenly recoiling... Collapsing onto himself where he stood."
 fotn_wedding.2.d:0 "Word waited a moment, letting the assorted gathering cheer as Midnight spoke, oddly enough, even his sister was amongst those cheering now, though whether that was because her own partner was cheering louder than anyone else present or because she genuinely supported this was unclear.\n\n\"And thus, do you, Hive Queen Yaria, agree to be bound under her sacred moonlight to Lord Marshal Midnight Spirit?\" Word asked once more, the same gravitas behind his words as there was when he'd asked Midnight the same question moments earlier.\n\n\"I do, yes.\" Yaria would nod towards Word, before once more looking down towards Midnight. \"Even if he is perhaps in an outfit that really doesn't suit him today.\"\n\nMidnight had to hold in a cackle unlike no other, as did everyone else present, before Word spoke up to clear the air. \"Then I may proudly declare the two of you Husband and Wife!\"\n\nWith that, the gathering went wild, Thistle outright yanked Flawless upright in the process of trying to rush towards the Lord Marshal, dragging his sister along with her with a grin that under any other circumstance would have been horrifying, all the while, Midnight near enough leapt forwards to embrace Yaria for a moment.\n\nBefore long, one of the ponies acting as an attendant would bring the Lord Marshal's flask to him, since he'd refused to drink before the ceremony. Midnight was quick to take it up, offering the pony genuine thanks, before finally taking a drink from the flask and..."
 fotn_wedding.2.t:0 "Blessed unity"
 happinessatlast.1.a:0 "\"Ja, Midnight, we will.\""
 happinessatlast.1.d:0 "\"I never expected this, you know?\" Midnight would cackle, the telephone so generously gifted to him by Chrysalis sat upon his desk, hoofset pressed close to his ear. \"I know we've worked together for so long, but for much of that time, the Thestral you knew... That thing... He wasn't...\"\n\n\"You forget something, Midnight, something very important... Potential. Let's not forget how many times you gladly listened at length about my thoughts on the potential for Changelings to match the magical capabilities of Unicorns, you know what I think of potential.\" Yaria would respond.\n\n\"Yeah... Yeah I do forget that sometimes.\" Midnight would sigh. \"Thankfully, I do have Changelingia's best mind to remind me when I falter, no?\"\n\nWhat followed was a loud cacophony of laughter shared between the two, loud enough that Midnight could feel his sister judging him from the office next door, he didn't care. He'd not been this happy in.. Ever.\n\n\"So when are you coming to Soryth again?\" Yaria asked, breaking the shared moment of amusement.\n\n\"As soon as I can, this whole Lord Marshal thing keeps me pretty busy, but I'll make the time.\" he'd respond, grinning from ear to ear. \"I love you.\"\n\n\"I know.\" Yaria was quick to mention. \"You feed me very well, and without any issue either. Many Changelings would kill for such an arrangement.\" She'd cackle. \"You know it's a shared sentiment.\"\n\nMidnight still wasn't used to that. He was used to hatred, both from himself and directed towards himself, it was... Odd. \"Listen, I should go, we're already misusing an official line as it is, and I was due to meet with Flawless an hour ago, we'll talk soon.\""
 happinessatlast.1.t:0 "A new beginning"
 herblessing.1.a:0 "If only she saw the grin on Midnight's face..."
 herblessing.1.d:0 "Vesalipolis. The capital itself, seat of Queen Chrysalis herself. Midnight had heard many things, he'd seen pictures, but nothing could have prepared him for the sight of such a city. It was truly gargantuan beyond all comprehension, still, he moved on with purpose. After coming so far, he wasn't about to falter at the sight of such a large city, no, this was too important for that. After all, he was here for a reason.\n\nThat reason being simple enough, for the first time since this all began, he had to stand before Chrysalis herself. Thankfully, he'd used his brain, or rather, Yaria did, and this wasn't some unexpected arrival, even so, the Changeling guards watched him keenly, after all, he was still Midnight Spirit, known for his absurd antics. Either way, the Thestral stepped onwards, making his way into the great tower which Chrysalis ruled from.\n\n\"Enter, Lord Marshal.\" A voice roared out as he stood outside the throne room, a voice he heeded immediately. As Midnight entered, a gaggle of the Changeling military general staff were on their way out, a cloud of cigar smoke trailing behind one of them as they went. Before another moment could pass, Midnight found himself at the foot of the Changeling throne, and it seemed that no matter how hard he tried to look up, he couldn't even come close to setting his eye upon Queen Chrysalis.\n\nThe Thestral backed up somewhat, until he finally could do so, and then, and only then, did he speak. \"Queen Chrysalis...\" He'd state plainly, offering a bow, but not kneeling. He would not kneel. \"My apologies for the somewhat short notice, the matter I'm here for is-\"\n\n\"You need not explain it, Midnight. I already know. VOPS, as you know, knows all.\" Chrysalis cut him off there and then, she already considered the meeting unnecessary, knowing full well why the Thestral had come here. \"You are here to request my approval for your marriage to Hive Queen Yaria of Soryth.\"\n\nMidnight nodded, daring not to speak until he was certain she had finished doing so herself. \"Yes... Yes I am here for that.\" Midnight conceded, all the while Chrysalis just nodded knowingly. \"I would usually never even consider making such a request... But considering who it is, and her role under yourself, I felt it was something of importance to-\"\n\n\"It is a simple matter. But one that you, indeed, should come to me to request permission to do. Preferably, you'd have asked me before you asked her... Alas... I can overlook such a transgression, just once. Do not waste my generosity.\" Chrysalis growled. \"I will approve this request, but... In future, you are to request things that should be brought to my attention before you do them, Midnight Spirit. Am I clear?\"\n\n\"Yes Queen Chrysalis, that is clear Queen Chrysalis.\" Midnight quickly stated, snapping upright as he grasped the weight of those words.\n\n\"You may leave, then, Lord Marshal.\" The Changeling Queen stated, waving him away as she did so. Midnight didn't linger, bowing once again before turning on his back heels, and quickly taking his leave..."
 herblessing.1.t:0 "The Little Thestral in Big Changelingia"
 midnightsjoy.1.a:0 "And not even Flawless could wait."
 midnightsjoy.1.d:0 "A moment passed, before Midnight finally turned to face those who had gathered, a grin like no other painted upon his face. It felt strange, this joy, it wasn't something he'd felt before, but he liked it. \"And so, all of you, this finally, after all these years, marks the end of one era, and the start of a new one...\" He'd pause, looking to smile at Yaria once again.\n\n\"I've done some... Downright horrific things over the years, back in Zebrica I had a reputation for a reason. But now? I feel like I finally get to start again...\" He'd sigh. \"Do I deserve it? Probably not. But I have it, and I won't be wasting it, that's for sure.\"\n\nSomething about what he said struck a chord with Flawless and Thistle, like they knew what he meant when he said all that. After all, the two of them had been there to see all he'd done in Zebrica, all he'd done in Equus too. But it was Thistle, oddly enough, that spoke up. \"We're just glad to still have you bo- Lord Marshal!\" \n\nMidnight shook his head with a soft laugh. \"Thistle, it's just Midnight today.\" He'd smile. \"Besides, you won't have me calling you Minister of Reconstruction when it's your turn to have one of these.\" He'd smirk knowingly, his one eye darting between her and his sister. \"Still, that's not important right now!\"\n\nHis words made the half-Kirin Thistle fall silent, but not out of anger, rather he'd put an even bigger grin on her face now, and she just snuggled up to Flawless like she always did.\n\nIn due time, hopefully, they'd be doing this all again."
 midnightsjoy.1.t:0 "Midnight's Joy"
 nightmareempire.1.a:0 "Sing high the praises of the True Goddess of the Night."
 nightmareempire.1.b:0 "Glory to Nightmare Moon!"
 nightmareempire.1.c:0 "Blessed be Her holy name!"
 nightmareempire.1.d:0 "Following the capitulation of Equestria to the Changelings and their odd, fanatical, southern allies, many have wondered what state would come out of the vile rhetoric that was being plastered all over Equus. Alas, the world no longer needs to wonder, as this evening Field Marshal, now self declared Regent, Midnight Spirit has made clear that the former territories under his control are to be reorganised into the Nightmareist Empire of Equus, a bold declaration that risks alienating the new state from even their loosely aligned friends, the changelings.\nMore war for the lands of Equus appears to be on the horizon, and all the rest of the world can do is watch, and pray that Midnight and his lackeys fail in their designs."
 nightmareempire.1.t:0 "Procomation of the Nightmareist Empire of Equus"
 nmm_appears.1.a:0 ""That's for you to discover alone, Lieutenant Colonel.""
 nmm_appears.1.d:0 "How long had it been since Midnight last slept? He didn't know, he couldn't know. Time was becoming a rapid blur to the Thestral. But even so, he remained as sharp as he could. His office may as well have become a prison at this point, leaving it only when he had to do so. It had become so boring, but it was a required evil until the Nightmare returned to them. What he didn't know, however, was that he was far from alone in his office this time.\n\nAs Midnight began to almost doze off, lit cigarette still sat in his mouth, the sudden sound of someone approaching his desk jolted him awake, and the sight before his eye had him believe he was hallucinating for a moment, it'd be far from the first time. \"Is that... Are you..?\"\n\nAs his eye finally settled on the figure, a frown formed upon his face. It wasn't her. Well, it was. But it still wasn't her. \"No.. You're not Nightmare Moon... You're Princess Luna...\" He'd say with a sigh. \"I shouldn't get my hopes up, should I?\"\n\nLuna let out a clearly aggravated huff, shaking her head at the Field Marshal. \"Don't play friendly, Midnight Spirit. You don't get to do that. None of your 'loyal followers of the Nightmare' do.\" She'd pause, pacing back and forth in front of his desk. \"You claim to be my- Her most loyal followers, yet everything you've done... It's disgusting. Countless crimes against ponykind, no follower of mine would ever do such things as you have.\"\n\n\"I've done what needed to be done in order to-\" Midnight went to retort, quite daringly given who it was he was supposedly speaking to.\n\n\"Do not even try to justify it. There is no justifying it, any of it. Thankfully for you... I know things, and unlike you I know the concept of pity.\" Luna sighed, by all rights, she could deliver swift justice right there, right then, but knowing what she knew, it wouldn't have been justice at all. \"You really do trust your medical staff, don't you? I wouldn't be so sure, given who they work for...\"\n\nMidnight looked absolutely stupefied by that, unable to speak for a moment he let out a hacking wheeze, before finally composing himself. \"What in Tartarus are you implying with that?\" He'd question, alas, as quickly as he could do so, as quickly as the Alicorn princess was before him, she was already in the process of fading back into the darkness she'd appeared from."
 nmm_appears.1.t:0 "The Nightmare to End All Nightmares"
 ourfriend.1.a:0 "\"Flawless isn't thinking right, contact the Changelings.\""
 ourfriend.1.b:0 "\"Perhaps sister is right... No, things as they are is just fine.\""
 ourfriend.1.d:0 "Following our little agreement with the Changelings, a great many questions have risen about how we should go about this going forwards.\n\nSome, mostly the hardline Nightmareists that wish for victory regardless of the cost, have proposed a formal military alliance be presented to the changelings.\n\nOthers, the more moderate parts of our organisation, headed by Midnight Spirit's own sister, have decried this as a disasterous idea.\n\nIn the end, only one may make the final call..."
 ourfriend.1.t:0 "Our Friend?"
 overseeingthework.1.a:0 "\"All resistance to Nightmareism will be handled appropriately, sir.\""
 overseeingthework.1.d:0 "Midnight Spirit stood upon the top of a watchtower, overlooking one of the newly constructed 'workplaces' for the local pony population, a monocular held up to his one eye, peering over the copious number of ponies, once free, now all working for the restoration of the nightmare upon her rightful pedestal.\n\n\"Magnificent, isn't it?\" Midnight's aide would ask. The Thestral seemingly beaming with some kind of pride at the abhorrent sight.\n\n\"Yes, it truly is quite-\" Midnight went to respond, only for his words to be drowned out by the calamitous roar of an explosion by the site's gate. A gate that, thankfully, was far from the watchtower he stood upon. \"I thought this place was secure, Thistle?\" He'd ask, the scowl upon his face making his displeasure plenty clear.\n\n\"It is- I mean, was, Midnight. In fairness, your visits attract a lot of attention from the locals...\" Was all Thistle could respond with, an exaggerated sigh leaving her as she shook her head, her flowing pink hair waving all over as she did so. \"I dare say it was another attack by the socialists... They have become quite militant since we took over.\" She explained.\n\n\"I don't care who it was. The fact it has happened is disgraceful enough! This must not occur again, Thistle, or I will start raising questions regarding whether allowing an exception for one of your... Heritage... Should have ever been permitted.\" Midnight would spit, the half-kirin recoiling the moment he spoke, half expecting those words to be followed with violence. Thankfully, they were not. For now.\n\n\"Yes sir, it will not happen again sir...\""
 overseeingthework.1.t:0 "Overseeing the New Works"
 quietatlast.1.a:0 "And so long as she had home, she was happy."
 quietatlast.1.d:0 "Thistle Torch's command station wasn't anything fancy, a glorified tent with a crate for a table. But for once, there weren't new reports to go over, just the sweet sound of nothing.\n\nIt was a rare thing these days, especially for Thistle, given all the new chaos, she'd almost grown used to all the noise, all the nonsense, but for the first time in months things were quiet. Quiet enough for reflection.\n\nWhilst she didn't always see eye to eye with her commanding officer, she remained firm in her belief that he was the only way forward... Even if some of his ideas, some of his connections, were offputting to say the least... Even so, it was better than being in Chiropterra, or Nightmare forbid, Kiria. She'd never seen Kiria, and she was thankful for it, after everything she'd learned from her father, the place didn't appeal to her at all, especially given the other half of her ancestry would likely become an issue... Being half Kirin in a cohort of Thestral supremacists was certainly quite the odd thing, but it was home..."
 quietatlast.1.t:0 "Quiet, at last..."
 shadowsend.1.a:0 "\"Well, that felt better than expected.\""
 shadowsend.1.d:0 "Sour Sweet's estate was quiet, deathly quiet. She'd been gifted the place not long after the defeat of Equestria, a token of thanks from Midnight. But this night was... Off. The silence was normal, but even this silence was deafening. Though, there was little time to stew on it, as the sudden clatter of hooves, followed by the opening of her study's door broke it without warning. As the door swung open, three figures entered, at the front stood Midnight, flanked by Flawless and another... A changeling officer.\n\n\"Midnight what are you-\" Sour went to ask, but the sudden roar of a revolver, Flawless's one, cut her off.\n\n\"YOU WILL SPEAK ONLY WHEN TOLD TO DO SO.\" Midnight practically screamed. He could handle this right here, right now, he really wanted to, but he didn't. He wasn't the uncivilised fiend she'd aimed to keep him as anymore. \"How many years, tell me... How many years were you and the scum you call the Shadowbolts poisoning me? HOW MANY?\"\n\nSour, initially, didn't even respond, utterly stupefied by the question being posed to her. \"Poisoned? What in Tartarus are you-\"\n\nAnother shot rocked the room, this one much louder, barely whizzing past the earthpony's ear. \"Do. Not. Even. Try.\" Midnight scowled. \"I already know. You aren't going to fool me, not now, not ever again. How many years?\"\n\n\"Thirteen.\" The mare answered, letting out a sigh as she slowly realised the situation she was really in. \"Thirteen years. It's when your mother-\"\n\nWhat followed, was something so loud it was a miracle that the windows didn't shatter. Exactly twelve shots rang out there and then, and a brief moment passed, a moment for Flawless to pass her own revolver to her brother, who had just emptied both of his own, so he could make use of it. The Thestral sauntered towards the clearly already dead earthpony, and fired off a final, thirteenth round."
 shadowsend.1.t:0 "The End of The Shadowbolt Scheme"
 sorythcalling.1.a:0 "Let's fucking goooo!"
 sorythcalling.1.d:0 "Midnight once more sat in his office, clearly mulling over what he'd been told by Nightmare Moon the night she appeared, the night she made her displeasure known. It was still eating at him, constantly refusing to leave the Field Marshal's mind. Though, the thought was interrupted by the sound of the door swinging open. A hoof darted for his revolver the moment it did, only to slink back behind his desk once the entering figure came into view, it was Flawless.\n\nFlawless stepped up to the desk, placing two things onto it. A written letter, and then most curiously, a plain black telephone. \"A changeling delivered this.\" Was all that left the mare, still clearly displeased with the idea of collaborating with the Changelings as she was before. Midnight didn't question it. He knew her stance, and instead opted to just take the letter to hoof, reading out loud as he always did.\n\n\"Field Marshal Midnight Spirit. In the interest of national collaboration between Changelingia and your own state, I have seen fit to delegate the delivery of a direct telephone linking between your own office, and the office of Hive Queen Yaria, whom has already been handling the matter of communication between our two states since your... Initial contact with us. As such, any vital communications are to be made to her, using the provided telephone whenever needed.\"\n\n\"Do not reply to this letter, I have greater tasks to attend to. Queen Chrysalis.\"\n\nMidnight's face lit up for a moment once he'd finished reading, all the while, Flawless stared at him with some measure of what was either disgust, or pity. To her, it was meaningless. He was in charge near enough in name only, this was just more of nothing. She just couldn't tell who the puppeteer was, the Changelings, or the Shadowbolts. \"Of course you're happy with that.\" she'd sigh.\n\n\"Of course I am damnit!\" Midnight barked back. \"Of course, I know for a fact VOPS has their hooves all over it, but I can work with that. Tartarus knows they would likely hear what we're saying now if I connected the thing up. Still, this is good, this is useful.\" \n\n\"You only think it's useful because you can't pick between grovelling to that Hive Queen, or Sour Sweet.\" Flawless retorted with a snort. \"You do you, of course, you're the one in charge. But sooner or later this is all going to explode in your face, you know that?\"\n\nMidnight's brow furrowed at that. \"You're questioning my leadership now? Sister... Please. Use your head. When have I ever gotten into anything without a planned out... All is going as I intend.\"\n\n\"Whatever you say, Midnight, whatever you damn well say.\" Flawless spouted, before marching straight back out of the office without another word."
 sorythcalling.1.t:0 "Soryth Calling"
 stupid_heresy.1.a:0 "This sounds like heresy..."
 stupid_heresy.1.d:0 "The streets of Canterlot were flooded for once, but not with happy, chattering ponies, no, there was a deathly silence over the city, as thousands had gathered into one singular square overlooked by a single raised platform, flanked by guards both Thestral and Changeling in origin, and stood upon that platform was the expected, lone, diminutive batpony, Midnight Spirit.\n\nThe speakers attached to the platform crackled, slowly roaring to life as he spoke. \"Greetings, everypony. Be you Thestral, or one of our cherished Changeling friends!\"\n\n\"Today I come with a... Difficult announcement, one that I am sure will draw the ire of many of my own, but one I need you all to accept. As you all know, we have worked tirelessly in the name of her majesty, The Nightmare, for years upon years. We fought and won in her name, and now I must pose a question... How have we been rewarded?\"\n\nMidnight fell silent for a moment, and the crowd began to chatter amongst themselves, before the speakers roared once more.\n\n\"With rejection! When we liberated this land, our homeland, The Nightmare rejected us! She appeared for the sole purpose of doing this, and then fled before any response could be given! Tell me, my friends, is that someone worthy of our reverence? One who looked at all we had done in her name and suggested it was all for nothing?\"\n\nA loud sigh echoed through the speakers following that, before Midnight went on speaking.\n\n\"My answer to that, my friends, is no! Which is why, here, publicly, today I am renouncing my faith in The Nightmare! Now... With that said, do I expect the same from ANY of you? No. I would not demand that. I demand only consideration, and understanding of the view I, and many amongst us hold.\"\n\nThe crowd roared up over the speakers, some cheering, others jeering, but the heavy guard ensured nothing escalated for the time being.\n\n\"All I will say is, do you know who did not reject us? Queen Chrysalis and her changelings. Think about that. Think real hard. Make your own conclusions. That is all. Thank you.\""
 stupid_heresy.1.t:0 "The Great Refusal"
 the_visit.1.a:0 "Not the most... Impressive start."
 the_visit.1.d:0 "The airfield outside of Puerto Caballo was rudimentary at best, more akin to a long dirt track flanked by tents acting as air traffic control centres, at the very least it was illuminated, albeit by dim purple lights lining the runway.\n\nAn unmarked aircraft hit the ground without much fanfare, seemingly carrying a singular passenger and them alone. The interior seemed lavish, at the very least it did from the brief glimpse Midnight got as the side door opened, a group of chained together ponies hurrying a ramp over to the aircraft's side. Before long the dim light revealed who that lone passenger was, as Sour Sweet trotted out, down the ramp that had been provided, and for the first time in years, Midnight Spirit greeted another with a salute, even if it was a quick one.\n\n\"I take it the flight was tolerable?\" Midnight inquired, his eye seemingly fixated on her expression for just a brief moment, only to finally let out a sigh of relief when he realised there was only a slight smile to be seen.\n\n\"It was acceptable. There was at least an attempt to make the aircraft suitable for me, I'll give you that.\" Sour chuckled, shaking her head. \"From your writings, I expected a state limousine, yet all I see is a rather dingy looking truck... Maybe I just overestimated things?\" She'd say backhandedly, now sporting a frown, which immediately led to Midnight letting out another sigh. \n\n\"It'd be better to save the Limousine for when we have another one of these in Canterlot, no?\" The Field Marshal shrugged, a pair of trucks pulling up alongside the one waiting for them, and he turned to observe them as they did so. \"I'm sure you've likely rode in worse chariots before, besides, I doubt many have had the luxury of being able to claim a Field Marshal has been their chauffeur, even for a day.\"\n\nThe Field Marshal's words drew out an unimpressed huff, before the mare spoke. \"Chauffeurs tend to drive things a bit more... Extravagant, don't they?\" \n\nMidnight couldn't help but cackle at that. \"Hey, we've all gotta start somewhere ain't we? Canterlot wasn't built in a day, neither was sunset for that matter. Still, next time, I wouldn't dare ask you to get into one of these...\"\n\nWith those words, the Thestral raised a hoof, gesturing towards the idle truck and the two began to slowly trot towards it, seemingly taking their time, engaging in some idle chitchat as they went"
 the_visit.1.t:0 "The Visit"
 the_visit.2.a:0 "Now... To business."
 the_visit.2.d:0 "The truck didn't take all too long to fire up, Midnight managing to get it to do so on the second attempt, a new record, usually it took four.\n\n\"How old even is this thing?\" Sour piped up, having gone silent whilst Midnight attemped to start the engine, and Midnight let out a soft chuckle. \"Must be what, at least twenty. A lot of these trucks have been with us since we left Chiropterra. This one certainly was.\" He'd pause, finally setting the vehicle into motion. \"This truck survived that, then the Mazwian Succession war after that. I'd say that's quite something, even if she's not fancy, she can handle any job you need her to.\" Midnight grinned, only to be met with a roll of Sour's eyes, and that shut him up.\n\nAfter that, he kept his mouth shut until he was spoken to, and that didn't take particularly long. \"So tell me, what exactly are you doing out here? I mean... A backwater like Puerto Caballo? Surely someone like you would end up somewhere more notable?\" Sour questioned, only to be met with a somewhat indifferent shrug from Midnight. \"We don't get to pick and choose where we end up, Sour. I certainly didn't. Not that I mind it, I mean, look around you, everything around here, all mine. Well, all the Nightmare's, but you get the idea I'm sure. How is New Mareland anyway? Truth be told, it's faded from memory somewhat, after all, last time I was there it must have been what, a decade ago, and I still had my wings back then...\"\n\nMentioning the wings sent Midnight silent, only for Sour to perk up with more questions. \"I was going to ask about the wings, aren't they something a lot of your associates put great value in? Surely the lack of them...\" \n\n\"No, they do not cause any issue. Whilst some who see me mistake me for an Earth Pony such as yourself...\" He paused, flashing a quick smirk. \"The sight of these tends to do away with any notion that I am such. Then again, I tend to enjoy it when I am underestimated as a result. In my line of work, we turn things like this into advantages...\" Midnight rambled, seemingly thinking he was quite smart for thinking the way he did, but Sour seemed mostly disinterested in the majority of it.\n\n\"How far do we need to go?\" Sour's voice oozed with impatience, but Midnight shrugged it off, dismissing it with a wave of his hoof. \"Not long, I had a pleasant enough place cleared out for the occasion, whole little restaurant to ourselves, I'm told it was quite the place before we showed up.\" He'd snort. \"It's still quite the place, I took the kitchen staff as my personal cooking team. Only thing that's changed for them is the uniform and the clientele.\"\n\nAs the two spoke, the truck finally came to a stop, and from the window, Sour could see the place in question, it was almost pristine, almost, a few bullet holes dotted the wall not far from the entrance, but otherwise, it was as though the coup never happened at all..."
 the_visit.2.t:0 "On the road"
 the_visit.3.a:0 "\"Yes, we shall.\""
 the_visit.3.d:0 "Unlike the far more... Informal arrival at the airfield, the restaurant was much, much more befitting for the Chairmare and the Field Marshal, that was abundantly clear the moment the building's doors swung open. The slightly scarred exterior was immediately contrasted by the bright, well decorated, clean interior, a single table sat in the middle of the dining area, the rest likely having been taken for use elsewhere, or taken as loot by 'enterprising' members of Midnight's cohort. \n\nNeedless to say, Midnight let Sour enter ahead of him, though, as he did so, he spoke up. \"You'll find this place more to your liking, a little taste of home you could say.\" He'd chuckle, gesturing to the room around them, the inside of the small Puerto Caballan building looking far more akin to a diner from New Mareland, something Midnight was rather proud of actually, a lot of these things had been hard to come by since the takeover, and in turn, Sour inspected the decor, nodding in approval for a moment as she did so,\n\n\"No expense spared, huh? I'm sure that totally didn't lead to something more useful being underfunded...\" She blurted out, and Midnight let out a loud snort in response. \"Oh, only the ration distribution network! Nothing too important, at least not important to me and mine.\" He'd cackle, shaking his head. \"There are benefits to being akin to a roving band of looters sometimes.\" Midnight shrugged, seating himself, three hoof taps on the tabletop followed, and not long after another set of ponies appeared, not in chains like the last serving ones were, but still clearly bound by something unseen.\n\n\"Well, you've certainly carved out your own place in the world. Even if it is a pitiful dusty backwater.\" Sour squinted at the thestral as she spoke, but settled into her own seat as she did so, taking that moment of silence to observe the serving ponies as they came by. One of them placed an ornately decorated mug in front of Midnight, two of the others holding two bottles of wine, silently expecting Sour to take her pick. She chose the red, and the moment she did, Midnight let out a chuckle. \"Good choice, that there is one of a kind, picked it up all the way in Hellquill, wasn't an easy grab either. But well worth the effort, I'm sure you'll agree.\"\n\nWith that, the two would chatter, catching up on things the other had missed, and for once, the Field Marshal seemed to lose that air for a moment, letting the batpony beneath the uniform out once more.\n\n\"I've enjoyed this.\" Midnight would grin. \"And I look forward to our continued work together, we'll have to do this again in due time...\" "
 the_visit.3.t:0 "Old friends, reunited at last."
 thecoup.1.a:0 "\"For she is the only one who can.\""
 thecoup.1.d:0 "Four ships. Four ships was all they had. A fifth had been arranged for, but for whatever reason it never did arrive to join the rest as they gathered off the Puerto Caballan coast. At their head sat a small fishing trawler, though, the lack of any fishing equipment on the deck made clear, this was no fishing vessel. Deep within it's cold steel bowels, a meeting was taking place.\n\n\"The plan remains simple\" One particularly loud voice echoed through the ship. \"The bulk of our force will enter the port under the guise of being goods vessels, that is why the ships are all flying New Marelander colors, they will arouse less suspicion!\" The voice spoke on, now clearly belonging to the group's commander, Midnight Spirit. \"Thistle's Cohort will make it's landing on the east docks, Flawless, yours will land on the southern docks. My own Cohort will land in the centre, and bear the brunt of the initial engagement.\"\n\n\"And what if they suspect something is wrong before we land?\" Two softer voices spoke up. Both in unison, something that seemingly was nothing new. They belonged to Thistle Torch and Flawless Spirit. The commander's adjutant and sibling respectively. \"The plan will continue as is, regardless of detection. I do not expect there to be much in the way of effective resistance, but resistance is resistance nonetheless.\" Midnight grumbled, shaking his head seemingly in disappointment. \"It's almost a shame we won't be facing a peer level force, but, what can one expect from those who are not our blessed kind...\" The commander's eye lingered on Thistle as he spoke that particular line, letting out an amused huff.\n\nAnother aide chimed in. \"Priority targets once we land, sir?\"\n\nThis aide did not have the fortune that the previous two had. And the commander's eye twitched for a moment, slowly shifting it's gaze towards them. \"Is that really, really, something that needs to be asked, Schizophora? Or did you simply wish to hear your own voice?\" Midnight hissed, to say the Thestral's tolerance was always tested by that Changeling's existence was putting it nicely. Unfortunately, capable commanding officers were in short supply at the best of times, and so Schizophora got to keep their head, for now. \"Still, local government buildings, medical facilities, police stations. Prioritize those.\"\n\nMidnight let those orders settle in for a moment, a hoof reaching up to scratch at where his left wing once was, only to catch himself and return the hoof to the ground with a loud crack against the steel below.\n\n\"This ship will be arriving three hours in advance, in order to deploy a smaller, more specialised team to hit at local communications infrastructure. Last thing we need is these locals calling up Canterlot and getting them involved. If the removal of communications cannot be made certain, this operation will not be going ahead.\" Midnight kept going, before pausing there, looking to the other three stood around the planning table. \"Any questions?\"\n\nThe resounding silence said it all, and the three collectively shook their heads.\n\n\"Good. We'll be making landfall in the next six hours. Get the rest whilst you can... There's a long road ahead.\" He'd fall silent, gesturing to dismiss the three of them. \"Oh, Thistle, hang behind a moment please.\" Midnight added, Schizophora and Flawless both squinting towards their commander, not particularly keen on being out of the loop in a time like this, still, they departed regardless, Thistle meanwhile slunk around the table, curious as ever about what she'd been held back for.\n\n\"Nightmare preserve us all...\" Midnight sighed..."
 thecoup.1.t:0 "The Coup"
 theplan.1.a:0 "Our time is now"
 theplan.1.d:0 "To call this a plan was laughable at best.\n\nFollowing their departure from Chiropterra, the band of fanatics following the former Field Marshal Midnight Spirit have turned into a glorified rabble. Even serving as mercenaries during the Mazwian succession war.\n\nThough this shift in focus lasted for a time, Midnight Spirit's faith in the cause never truly went away, and in more recent times, had in turn seized him and his followers in it's grip. But with their views being unwelcome even in Chiropterra, they would need to seize their own place to work from.\n\nAnd so a plan was drawn up, hastily in fact, and it was definitely a plan, not a good one, or a reliable one, but it was a plan nonetheless.\n\nA plan that True Lunarism's fate hung upon..."
 theplan.1.t:0 "The Plan"
 thetruth.1.a:0 "Time to call Soryth."
 thetruth.1.b:0 "Alas... There were none for him to call"
 thetruth.1.d:0 "Midnight was pouring over documents, ripping filing cabinets apart without care. Over and over again, seemingly searching for something.\n\nFinally, he found what he was seeking, near enough ripping the filing cabinet apart in the process, bringing the paper to his eye, he began to read out loud.\n\n\"Medical Record, Midnight Spirit, suspected illnesses, Psychosis, Delusional Disorder. Advised treatment:\"\n\nMidnight's voice trailed off, that section was coated in black ink, and it had been for years at this point, since he'd left Chiropterra he'd had the same personal physician, and he'd always trusted this one, given they were someone connected to his mother. Then an attached piece of paper fell onto the ground, Midnight immediately darted to pick it up, once again reading it.\n\n\"Amended advised treatment, supply patient with hallucinogenics in order to intensify symptoms, ensure survival and usefulness.\"\n\nThe signature and stamp that followed that attachment made the stallion's heart sink. It was a Shadowbolt stamp, and the signature was clear enough. Sour Sweet. The Mare he'd grown so attached to was the very same one that he now knew was behind all this, behind all the things he'd done... \n\nMidnight wanted to scream. He wanted to storm out of the office, find the first Shadowbolt he saw and execute them there and then. But he knew better than that. For all the insanity he'd caused and been a part of, he'd never felt so sane in this moment. \n\nHe needed to make a phone call to some friends..."
 thetruth.1.t:0 "The Truth"
 whereisshe.1.a:0 "\"Where. Is. She?\""
 whereisshe.1.d:0 "Midnight walked the streets of Canterlot, flanked on either side by his usual followers, Flawless Spirit and Thistle Torch, the two aides that had been with him since the very beginning of all this. Whilst the two of them seemed pleased, happily chattering amongst themselves, sharing this moment of victory, Midnight was silently seething...\n\n\"How can you two be pleased right now?\" He'd turn his head, asking the pair of them. \"We've done all this, and yet there's still silence... The Nightmare has still not returned to us...\"\n\nThistle and Flawless both stopped dead once he spoke, the sudden bark of his words catching them off guard, so much so that Thistle slunk off to hide behind Flawless, a fool's errand, given Thistle towered over the other two massively.\n\n\"I... Because we won, Midnight? We finally won!\" Flawless responded, not letting his tone get to her quite so easily. \"Can't we have that, after all this time?\"\n\nMidnight sighed, shaking his head. \"We haven't won, not even close to won, not yet... Our Queen, our Goddess... She is still not here. So long as I must hold the seat of power, we have not won...\" The one-eyed Thestral paused. \"Do you think her absence is worth celebrating?\"\n\n\"Well... No, I don't. Of course I don't.\" Flawless nodded along, before correcting herself. \"We, I mean we, we don't.\"\n\n\"Then shut it. Stop your blatant disregard of the situation... Our work is far from done. It will not be done until we answer the lingering question...\""
 whereisshe.1.t:0 "Where is She???"
 yariakisser.1.a:0 "For she was the strength he'd sought."
 yariakisser.1.d:0 "Midnight had lost track of the years by this point. It felt like yesterday that he'd arrived in the cold North of Changelingia for the first time. It was a risk, one he perhaps shouldn't have taken, but it was one that had saved him from the scheming of the shadowbolts, the long and drawn out machinations of his own mother. That chance to be free, to be himself, that was something he wouldn't forget anytime soon. But even so, their roles always kept them apart. Soryth was a long, long way from Canterlot, and that distance tugged at him constantly, not just because of the physical distance, but because of the emotional one too. He'd been a fool to think that he could ever be truly free of his past entirely, and that was something he'd already accepted. He could be the new stallion he was now, but that could never change the horrors he'd perpetuated, the horrors he'd never truly forgive himself for.\n\nAnd yet, even then, he couldn't help but keep finding his mind drifting back to her, even when the mental image of all those horrors ran through his mind, they would always be drowned out by her.\n\nThe thoughts he was stewing on suddenly came to an immediate halt. The phone in his office was ringing, and the sound of it made him jump, he wasn't expecting any calls this time, this one was something unexpected. His hoof uneasily shifted to pick it up, and the moment he did, a sigh of relief left him. "Midnight Spirit, this is Yaria speaking, ja. I trust all is well in the east?"\n\n"Yes, all is mostly well, for once. My apologies, wasn't expecting a call from you, Yaria. I was just... Thinking." Midnight's voice was quiet, and it was clear he was still somewhat shaken by what he'd been thinking about. "It's quite funny, I was just thinking about you, and all you've done for us over here. I cannot overstate my gratitude for your assistance, and the assistance of your people. I know it is not easy to work with us, but you have been nothing but helpful, even when considering those difficulties." He'd pause, before continuing. "I was just thinking about how long it's been since I've seen you, and how much I miss your company. I know we are both busy, but I hope we can meet again soon." \n\nYaria's voice softened, a hint of a smile in her tone. "I miss you too, Midnight. It has been far too long since we last saw each other. I will be sure to visit you as soon as I am free to do so. Until then, please take care of yourself." \n\nMidnight's heart swelled with warmth at her words, and he felt a sense of comfort knowing that she cared for him as much as he did for her. "Thank you, Yaria. I will do my best to stay safe until we meet again." \n\nThe call ended, and Midnight sat back in his chair, a small smile on his face. For the first time in a long time, he felt a sense of hope and happiness. The thought of seeing Yaria again gave him something to look forward to, and he knew that no matter what challenges lay ahead, he would face them with her in mind."
 yariakisser.1.t:0 "The Hive Queen of Soryth"
 firstcontact.1.a:0 "This can only go well, right?"
 firstcontact.1.d:0 "Midnight stood upon the deck of what was, by all means, an insignificant vessel, a destroyer formerly belonging to the Puerto Caballans before his takeover of the island nation, though, he was far from the usual warmer climate he had become rather accustomed to by now, rather, the air was cold, ice cold. He took a moment to take it in, he'd never felt weather like this in his life, but it was a necessity at the present time. Whilst some in his entourage considered dealing with the Changelings was tantamount to utter blasphemy, Midnight was always a pragmatist at heart. \n\n\"Are you certain this is a wise course of action, Midnight.\" A loud, but soft voice asked from behind him, and he turned to face it's source, Thistle Torch, one of his inner circle.\n\n\"We haven't come this far to turn around, Thistle. Wise or not, we've got to go ahead at this point. I'm sure you share Flawless's opinion on this.\" Midnight would snort, shaking his head as he looked back to the frozen ocean ahead of them.\n\n\"No. I think more friends is always great! I just... I don't know... I've heard things about them...\" Thistle replied, her initially hopeful tone fading into one that was much more sheepish. All the while, the icy sea slowly began to shift, and snow covered land began to come into view.\n\n\"Well, try to keep an open mind for me, would you?\" Midnight sighed, starting to slink away from the open air of the deck, which perhaps was for the best, as now a Changeling vessel was shifting into position to intercept them..."
 firstcontact.1.t:0 "First Contact"
 firstcontact.2.a:0 ""What did you mean by 'VOPS knew of your arrival in advance?""
 firstcontact.2.d:0 "The Changeling vessel was certainly a sight to behold, midnight had seen many ships before, but none quite like this. The sleek, dark hull of it began to slowly pull up alongside their own ship and all upon the deck stood there in awe for a moment, before a bright floodlight blinded them all, a loud speaker cracked to life, a voice echoing from it. \"This is the captain of the CNS Temporal, you are to halt your vessel and prepare for immediate boarding."\n\nMidnight's eye narrowed, a sigh leaving him before he turned to look towards Schizophora, who had conviniently decided to finally appear beside him at this very moment. \"Do your people always have such harsh welcome wagons?\" Midnight would ask, voice absolutely oozing with sarcasm, the Thestral's tone making it clear he was not impressed with the Changeling's approach. \n\n\"I assure you, Field Marshal, this is standard procedure for all vessels entering our waters.\" Schizophora replied, their tone calm and collected, though Midnight could tell they were just as unimpressed as he was.\n\n\"Well, I suppose we have no choice but to comply.\" Midnight muttered, before turning back to the Changeling vessel. \"Very well, we will halt our vessel and prepare for boarding. Please send your boarding party over.\"\n\nThe loudspeaker crackled once more, before a group of Changelings began to descend from the Temporal onto their own ship. Midnight watched them carefully, his eye scanning each one as they approached. He could feel the tension in the air, and he knew that this meeting could go either way.\n\nAs the Changelings boarded their ship, Midnight stepped forward to greet them. "Welcome aboard. I am Field Marshal Midnight Spirit, and these are my aides, Flawless Spirit and Thistle Torch." He gestured to each of them in turn.\n\nThe lead Changeling stepped forward, bowing slightly. "I am Captain Veyra of the CNS Temporal. You should be glad VOPS knew of your arrival in advance, 'Field Marshal'." They spoke with a tone of moderate respect, though Midnight could sense an underlying tension.\n\n"Aye, Captain Veyra." Midnight replied, his tone equally respectful. \"I hope we can come to a mutual understanding here, as you can likely imagine, getting here wasn't particularly...Easy."\n\nThe two groups exchanged pleasantries for a moment before being led to a makeshift conference room aboard the Temporal. The room was sleek, clean even, a stark contrast to the more organised chaos of Midnight's own ship.\n\nAs they sat down at the table, Midnight couldn't help but feel a sense of unease. This was uncharted territory for him and his cohort, and he knew that any misstep could have dire consequences."
 firstcontact.2.t:0 "Meeting the Changelings"
 firstcontact.3.a:0 "Aye Captain, we'll see how it goes"
 firstcontact.3.d:0 "Those words seemingly came as somewhat of a surprise to the captain of the Temporal, though, they were met with a simple chuckle, albeit one in the usual buzzing, shrill tone Changelings always spoke with. "Did your particularly green Changeling associate not inform you?" Verya scoffed. "He made contact three weeks ago, listing exact arrival dates, the ship's course... The whole lot in fact, even your proposals..."\n\nMidnight stared between the two changelings for a moment, a scowl forming on his face as his eye settled on Schizophora. "He did not, no..." He'd growl, before shaking his head. "I dare say the answer regarding said proposals is already prepared, then?"\n\nVeyra nodded, letting out a somewhat exhausted huff. "In a way, yes, perhaps one like yourself would consider it more of a counteroffer... " Which in turn, earned a raised eyebrow from the Thestral listening to him, but before Midnight could respond or retort, Verya kept going. "Your points regarding the occupation of Equestria have been noted, however... The conquest of the West by us is inevitable and non-negotiable. The East however..." The captain paused for a moment. "The east, we may indeed be willing to part with for the sake of avoiding something rather... Catastrophic."\n\nMidnight wanted to scowl, he really did, to dare tell him that something he demanded couldn't be his was laugable, at least in his mind. And he'd promised Sour Sweet a tour of conquered Las Pegausus, but he knew he wasn't in a position to negotiate or barter on the matter. "So the East then... I can work with that, with a few stipulations... I want the-" he'd go to speak on, but Verya just shook his head.\n\n"There is no need for that, Field Marshal, more specifics can be worked out down the line. This arrangement will do for now, no?" He'd ask, and in turn Midnight nodded in agreement, which drew out a concerning grin from the captain. "Good. Now. You'll be coming with us for the moment, Hive Queen Yaria is to handle our dealings with you, as such, a visit to Soryth is in order... And then you can go 'home'.""
